<!DOCTYPE html>
<html>
<head>
  <title>ClipFlop</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    input, textarea, button { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
    textarea { font-family: inherit; resize: vertical; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; display: none; white-space: pre-wrap; }
    .moment { margin-bottom: 14px; }
    .moment a { font-weight: bold; color: #0b57d0; }
    .durations { display: flex; gap: 8px; margin: 10px 0; }
    .durations button { width: auto; flex: 1; padding: 8px; background: #eee; border: 1px solid #ccc; cursor: pointer; }
    .durations button.active { background: #0b57d0; color: white; border-color: #0b57d0; }
    #note { font-size: 13px; color: #666; margin-top: 4px; }
    label { font-weight: bold; margin-top: 14px; }
  </style>
</head>
<body>
  <h1>ClipFlop</h1>
  <p>Paste a YouTube or Google Drive link to find the best moments.</p>

  <label>Video link:</label>
  <input type="text" id="videoLink" placeholder="YouTube or Google Drive link">
  <div id="note">Google Drive links must be set to "Anyone with the link can view." Long or large Drive videos may time out.</div>

  <label>Clip length:</label>
  <div class="durations">
    <button type="button" data-d="10">10s</button>
    <button type="button" data-d="15">15s</button>
    <button type="button" data-d="20" class="active">20s</button>
    <button type="button" data-d="30">30s</button>
  </div>

  <label>Custom instructions (optional):</label>
  <textarea id="customPrompt" rows="3" placeholder="e.g. focus on funny reactions only, avoid slow parts, prioritize dialogue..."></textarea>

  <button onclick="processVideo()">Find Highlights</button>

  <div id="result"></div>

  <script>
    var selectedDuration = 20;

    document.querySelectorAll('.durations button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.durations button').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        selectedDuration = parseInt(btn.dataset.d, 10);
      });
    });

    function getVideoId(link) {
      var l = link;
      try { l = decodeURIComponent(link); } catch (e) {}
      var m = l.match(/(?:youtu\.be\/|v=|shorts\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : '';
    }

    function toSeconds(t) {
      var p = t.split(':').map(Number);
      return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
    }

    function showResult(text, id) {
      var box = document.getElementById('result');
      box.textContent = '';
      var re = /(\d{1,2}:\d{2}(?::\d{2})?)\s*[-–]\s*(\d{1,2}:\d{2}(?::\d{2})?)/;
      text.split('\n').forEach(function (line) {
        if (!line.trim()) return;
        var div = document.createElement('div');
        div.className = 'moment';
        var m = line.match(re);
        if (m && id) {
          div.appendChild(document.createTextNode(line.slice(0, m.index)));
          var a = document.createElement('a');
          a.href = 'https://youtu.be/' + id + '?t=' + toSeconds(m[1]);
          a.target = '_blank';
          a.textContent = m[0];
          div.appendChild(a);
          div.appendChild(document.createTextNode(line.slice(m.index + m[0].length)));
        } else {
          div.textContent = line;
        }
        box.appendChild(div);
      });
    }

    async function processVideo() {
      var link = document.getElementById('videoLink').value.trim();
      var customPrompt = document.getElementById('customPrompt').value;
      var box = document.getElementById('result');
      box.style.display = 'block';

      if (!link) {
        box.textContent = 'Please paste a YouTube or Google Drive link.';
        return;
      }

      box.textContent = 'Processing... Drive links can take up to a minute.';

      try {
        var response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoLink: link, duration: selectedDuration, customPrompt: customPrompt })
        });
        var data = await response.json();
        showResult(data.message, getVideoId(link));
      } catch (e) {
        box.textContent = 'Something went wrong. Please try again.';
      }
    }
  </script>
</body>
</html>
